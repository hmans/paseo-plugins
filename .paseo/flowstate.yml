initial: planning

actions:
  - label: Make a commit
    icon: GitCommitHorizontal
    when: git.dirty
    prompt: |
      Review the uncommitted changes and make a Conventional Commit.
      If the current branch has a configured upstream, push to it.
      Otherwise, leave the commit local.

states:
  planning:
    label: Planning
    icon: NotebookPen
    actions:
      - label: Explore requirements
        icon: Search
        prompt: |
          Explore the requirements for the current task.
          Identify open questions and discuss them with the user.
          Stay in planning until a plan is agreed.
      - label: Write a plan
        icon: ListTodo
        prompt: |
          Fill this workspace's Flowtasks outline with concrete implementation tasks
          for the work discussed with the user.
          Read the existing outline with flowtasks_get, then use flowtasks_change
          to create or refine tasks and subtasks, including verification steps.
          Build on existing tasks and avoid duplicates.
          Ask the user to resolve any blocking decisions.
          Once the plan is agreed and recorded in Flowtasks, transition the workspace
          to implementing.
    transitions: [implementing]

  implementing:
    label: Implementing
    icon: Code
    actions:
      - label: Implement the plan
        icon: Code
        prompt: |
          Implement the agreed plan and run the relevant checks.
          When the changes are ready for review, transition to reviewing.
      - label: Revisit the plan
        icon: Undo2
        prompt: |
          Explain which parts of the plan need to change and why.
          Transition to planning so we can revise it together.
    transitions: [planning, reviewing]

  reviewing:
    label: Reviewing
    icon: ScanEye
    actions:
      - label: Review changes
        icon: ScanEye
        prompt: |
          Review the changes for correctness, regressions, and missing checks.
          If fixes are needed, summarize them and transition to implementing.
          Otherwise, report the verification results and transition to done.
    transitions: [implementing, done]

  done:
    label: Done
    icon: CircleCheck
    actions:
      - label: Archive workspace
        operation: workspace.archive
        when: github.pr.merged
      - label: Start the next task
        icon: Plus
        prompt: |
          Summarize the completed work, then ask what we should tackle next.
          Perform a git fetch, then move this worktree to a new branch off of origin/main.
          Transition to planning for the next task.
    transitions: [planning]
